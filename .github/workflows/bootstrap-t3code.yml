name: Bootstrap T3 Code Source

# The first push of this file imports a pinned upstream snapshot into the empty repository.
# It can also be run manually. It deliberately does NOT copy upstream GitHub workflows.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-t3code.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t3cn-source-bootstrap
  cancel-in-progress: false

jobs:
  import:
    name: Import upstream source and apply mobile Chinese localization
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_COMMIT: d13fc846700e5bb7d63e1bfaabb1e55733912b21
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch upstream source (omit huge reference repos and upstream CI)
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/t3code-upstream"
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/pingdotgg/t3code.git "$src"
          git -C "$src" sparse-checkout init --cone
          git -C "$src" sparse-checkout set apps assets docs infra native oxlint-plugin-t3code packages packaging patches scripts .vite-hooks
          git -C "$src" fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C "$src" checkout --detach "$UPSTREAM_COMMIT"
          rsync -a --exclude=.git --exclude=.github --exclude=README.md "$src/" ./
          test -f apps/mobile/app.config.ts
          test -f apps/mobile/eas.json
          test -f LICENSE

      - name: Prepare independent Chinese iOS build settings
        run: node tools/t3cn/prepare-build.mjs

      - name: Apply Simplified Chinese to mobile UI literals
        run: node tools/t3cn/localize.mjs

      - name: Commit imported sources to this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import T3 Code iOS source with initial Simplified Chinese UI"
          git push origin HEAD:main

      - name: Import summary
        run: |
          echo "## T3 Code CN source import" >> "$GITHUB_STEP_SUMMARY"
          echo "Imported pinned upstream commit and preserved MIT license." >> "$GITHUB_STEP_SUMMARY"
          echo "Chinese mobile UI translation and independent EAS iOS configuration applied." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not build or sign iOS; use Build T3 Code CN iOS after configuring Expo credentials." >> "$GITHUB_STEP_SUMMARY"
